<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Photo Feed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container-fluid">

        <div class="row bg-body-tertiary"  >
            <nav class="navbar navbar-expand-lg bg-body-tertiary ">
                <div class="container-fluid border py-3  d-flex justify-content-between">


                    <div class="info-pagina ms-5 d-flex align-items-center">

                        <div class="logo  mt-1">

                            <i class="fa-regular fa-camera ms-auto fa-2x"></i>

                        </div>

                        <div class="instagram  ms-1 pb-3 fs-1">

                            <a class="navbar-brand" href="#">Instagram</a>

                            
                        </div>

                        



                    </div>

                    <div class="d-flex me-5 border">
                            <!-- Button trigger modal -->
                            <button type="button" class="btn btn-success me-3" data-bs-toggle="modal" data-bs-target="#Modal" >
                                Create a new post
                            </button>

                            <!-- Modal -->
                            <div class="modal fade" id="Modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true" >
                            <div class="modal-dialog">
                                <div class="modal-content">
                                <div class="modal-header">
                                    <h3 class="modal-title fs-4" id="exampleModalLabel">Create a New Post</h3>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body ">

                                    <div class="row "></div>
                                    
                                    <div class="mb-3">
                                        <label for="exampleFormControlTextarea1" class="form-label">Caption:</label>
                                        <textarea class="form-control" id="exampleFormControlTextarea1" rows="3" placeholder="Add the caption of your post here"></textarea>
                                    </div>

                                    <div class="botones ">

                                        <button type="button" class="btn btn-outline-secondary">
                                            <i class="fa-solid fa-camera"></i>
                                        </button>
                                        <button type="button" class="btn btn-outline-secondary">

                                            <i class="fa-solid fa-location-dot"></i>
                                        </button>
                                    </div>


                                    
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                    <button type="button" class="btn btn-success">Publish</button>
                                </div>
                                </div>
                            </div>
                            </div>

                            <div class="dropdown">

                                <button class="btn btn-secondary d-flex align-items-center dropdown-toggle dropdown-menu-end" type="button" data-bs-toggle="dropdown" aria-expanded="false"  >

                                    <div class="">
                                        <i class="fa-solid fa-gear"></i>

                                    </div>
                                    
                                    
                                
                                </button>

                                <ul class="dropdown-menu dropdown-menu-end mt-1">
                                    <li><a class="dropdown-item" href="#">Profile</a></li>
                                    <li><a class="dropdown-item" href="#">Accesability</a></li>
                                    <li><a class="dropdown-item" href="#">Privacy and Data</a></li>
                                    <li><hr class="dropdown-divider"></li>
                                    <li><a class="dropdown-item text-danger" href="#">Log out</a></li>
                                </ul>


                            </div>
                            
                    </div>

                    
                    
                    



                </div>
                    
                
            </nav> 

        </div>

        <section id="section-1" >
            <div class="container-fluid row h-100  d-flex ">
                <div class="col-12 col-lg border m-1  ">
                    <img class="w-100  img-fluid" src="https://picsum.photos/id/1/75/" alt="" >

                </div>
                <div class="col-12 col-lg border m-1">
                    <img class="w-100" src="https://picsum.photos/id/100/100/" alt="">

                </div>
                <div class="col-12 col-lg border m-1">
                    <img class="w-100" src="https://picsum.photos/id/80/100/" alt="">

                </div>
                          



            </div>

            <div class="container-fluid row  h-100 d-flex ">
                <div class=" col-12 col-lg border m-1">
                    <img class="w-100" src="https://picsum.photos/id/99/100/" alt="">

                </div>
                <div class="col-12 col-lg border m-1">
                    <img class="w-100" src="https://picsum.photos/id/45/100/" alt="">

                </div>
                <div class="col-12 col-lg border m-1">
                    <img class="w-100" src="https://picsum.photos/id/50/100/" alt="">

                </div>
                          



            </div>

            <div class="container-fluid row  h-100 d-flex">
                <div class="col-12 col-lg border m-1">
                    <img class="w-100" src="https://picsum.photos/id/65/100/" alt="">

                </div>
                <div class="col-12 col-lg border m-1">
                    <img class="w-100" src="https://picsum.photos/id/135/100/" alt="">

                </div>
                <div class="col-12 col-lg border m-1">
                    <img class="w-100" src="https://picsum.photos/id/78/100/" alt="">

                </div>
                          



            </div>

        </section>

        <section id="section-2">

            <div class="row">

                <div class="card w-50 mx-auto">
                    <div class="header d-flex justify-content-between h-100 p-4">
                        <div>Linda Imagen</div>
                        <div>04/26</div>
                    </div>
                    <img src="https://picsum.photos/150" class="card-img-top w-100 h-100" alt="...">
                    <div class="card-body">
                        <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card’s content.</p>
                    </div>
                
                </div>
            </div>


        </section>
    </div>
            
            
                
            
              
                

                                      
                
                
            

            
            
        
        
        
    
    





    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
</body>
</html>
